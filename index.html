    {
      "@type": "Question",
      "name": "A Inteligência Artificial da Sous Clinic substitui o contato com profissionais de saúde?",
      "acceptedAnswer": {
        "@type": "Answer",
        "text": "A Sous Clinic atua como uma extensão da sua equipe clínica. Ela cuida do monitoramento pós procedimentos, permitindo que o profissional de saúde tenha mais tempo para focar no atendimento. A IA não tira dúvidas e nem sugere nada, apenas realiza triagens e retorna o resumo da conversa para o profissional, que tomará a decisão final."
      }
    },
    {
      "@type": "Question",
      "name": "É seguro deixar uma IA falar com meus pacientes? Ela pode inventar informações?",
      "acceptedAnswer": {
        "@type": "Answer",
        "text": "A segurança é nosso pilar principal. Utilizamos uma Engenharia de Contexto Proprietária. A IA só responde com base no contexto clínico capturado na prescrição e nos protocolos definidos pelo profissional. Ela não alucina nem inventa tratamentos."
      }
    },
    {
      "@type": "Question",
      "name": "A Sous Clinic é apenas para agendamento de consultas?",
      "acceptedAnswer": {
        "@type": "Answer",
        "text": "Somos muito mais do que apenas agendamentos. Nos diferenciamos dos sistemas tradicionais porque focamos na área da estética, na fidelização e na jornada de recuperação do paciente, e não apenas nas tarefas administrativas de agenda."
      }
    },
    {
      "@type": "Question",
      "name": "Na minha clínica existe mais de um profissional, é possível usar o Sous Clinic?",
      "acceptedAnswer": {
        "@type": "Answer",
        "text": "Com certeza. O Sous Clinic foi desenhado para escalar. O plano Profissional suporta até 20 usuários e 3 unidades diferentes. Cada profissional possui um login individual com acesso exclusivo aos seus pacientes."
      }
    },
    {
      "@type": "Question",
      "name": "A Sous Clinic fornece treinamento para utilização da plataforma?",
      "acceptedAnswer": {
        "@type": "Answer",
        "text": "Sim. Ao ter a Sous Clinic como parceira, toda a sua equipe recebe treinamento para utilizar a plataforma na sua melhor performance. Esse treinamento pode ocorrer de forma presencial ou remota."
      }
    }
  ]
}
